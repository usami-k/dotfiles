#:schema https://docs.jj-vcs.dev/latest/config-schema.json

[signing]
behavior = "drop"
backend = "gpg"

[signing.backends.gpg]
program = "/opt/homebrew/bin/gpg"

[revset-aliases]
"immutable_heads()" = "builtin_immutable_heads() | remote_bookmarks()"

[[--scope]]
--when.commands = ["status"]

[--scope.ui]
paginate = "never"

[revsets]
git-sign-on-push = "~signed() & mine()"
log = "builtin_log() | latest(tags(), 2)"

[aliases]
ws-status = ["util", "exec", "--", "jj-ws", "status"]
ws-remove = ["util", "exec", "--", "jj-ws", "remove"]
