#:schema https://docs.jj-vcs.dev/latest/config-schema.json

[signing]
behavior = "drop"
backend = "gpg"

[signing.backends.gpg]
program = "/opt/homebrew/bin/gpg"

[revset-aliases]
"immutable_heads()" = "builtin_immutable_heads() | remote_bookmarks()"

[[--scope]]
--when.commands = ["status"]

[--scope.ui]
paginate = "never"

[revsets]
git-sign-on-push = "~signed() & mine()"
log = "builtin_log() | latest(tags(), 2)"

[aliases]
ws-status = ["util", "exec", "--", "jj-ws", "status"]
ws-remove = ["util", "exec", "--", "jj-ws", "remove"]

[template-aliases]
'agent_trailer(name, email)' = '''
if(config("agent-trailers." ++ name) && !trailers.any(|t| t.value().contains(email)),
  config("agent-trailers." ++ name).as_string() ++ "\n")'''

[templates]
commit_trailers = '''
agent_trailer("claude", "noreply@anthropic.com")
++ agent_trailer("codex", "noreply@openai.com")
++ agent_trailer("cursor", "cursoragent@cursor.com")'''

[[--scope]]
--when.environments = ["CLAUDECODE=1"]

[--scope.agent-trailers]
claude = "Co-Authored-By: Claude <noreply@anthropic.com>"

[[--scope]]
--when.environments = ["CODEX_THREAD_ID"]

[--scope.agent-trailers]
codex = "Co-authored-by: Codex <noreply@openai.com>"

[[--scope]]
--when.environments = ["CURSOR_AGENT=1"]

[--scope.agent-trailers]
cursor = "Co-authored-by: Cursor <cursoragent@cursor.com>"
