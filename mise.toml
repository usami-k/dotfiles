[tasks.fmt]
description = "Format all fish files in place"
dir = "{{config_root}}"
run = "find . -name .git -prune -o -name '*.fish' -exec fish_indent -w {} +"

[tasks."fmt:check"]
description = "Report fish files that need formatting, without writing"
dir = "{{config_root}}"
run = "find . -name .git -prune -o -name '*.fish' -exec fish_indent --check {} +"

[tasks."test:repositories"]
description = "Test safe eupdate working-copy updates with temporary local repositories"
dir = "{{config_root}}"
run = "fish --no-config tests/eupdate-repositories.fish home/.environment/repositories/eupdate.fish"

[tasks."test:jj-colocate"]
description = "Test jj colocation of git clones with temporary local repositories"
dir = "{{config_root}}"
run = "fish --no-config tests/jj-colocate.fish home/.config/fish/functions"

[tasks."test:mise-cleanup"]
description = "Test eupdate tool pruning and disconnected-volume protection with mock tools"
dir = "{{config_root}}"
run = "fish --no-config tests/eupdate-mise-cleanup.fish home/.environment/mise-cleanup/eupdate.fish home/.environment/eupdate.fish"

[tasks."test:eupdate-failures"]
description = "Test update failure reporting with isolated mock commands"
dir = "{{config_root}}"
run = "fish --no-config tests/eupdate-failures.fish home/.environment"

[tasks."test:castle-review"]
description = "Test persistent content review and independent runtime checks with local Git fixtures"
dir = "{{config_root}}"
run = "uv run --offline --no-project --no-cache --python /usr/bin/python3 tests/castle-review.py"
